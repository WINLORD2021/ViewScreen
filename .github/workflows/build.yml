
name: ViewScreen 0.4 - Host and Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail

          ZIP=ViewScreen-0.4-Host-Client.zip

          echo "40f0288a227654fb01f8eab59328023c2a15389a76d34e409446c155694a6747  $ZIP" | sha256sum -c -

          mkdir -p project
          unzip -q "$ZIP" -d project

          test -f project/host/build.gradle
          test -f project/client/build.gradle
          test -f project/settings.gradle

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test ViewScreen VS04 protocol
        shell: bash
        run: bash project/tests/run.sh

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager --sdk_root="$SDK" \
              'platforms;android-35' \
              'build-tools;35.0.0'
          fi

          test -f "$SDK/platforms/android-35/android.jar"
          test -x "$SDK/build-tools/35.0.0/apksigner"

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "VIEWSCREEN_SDK=$SDK" >> "$GITHUB_ENV"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Configure automatic authentication
        shell: bash
        env:
          PRIVATE_LINK_KEY: ${{ secrets.VIEWSCREEN_LINK_KEY }}
        run: |
          set -euo pipefail

          KEY="${PRIVATE_LINK_KEY:-$(python3 -c 'import secrets; print(secrets.token_urlsafe(16))')}"

          echo "::add-mask::$KEY"

          if [[ ! "$KEY" =~ ^[A-Za-z0-9_-]{22}$ ]]; then
            echo "::error::Invalid ViewScreen link key"
            exit 1
          fi

          echo "VIEWSCREEN_LINK_KEY=$KEY" >> "$GITHUB_ENV"

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/viewscreen.keystore"

          if [[ -n "$KEYSTORE_BASE64" ]]; then

            : "${KEYSTORE_PASSWORD:?Missing store password}"
            : "${KEY_ALIAS:?Missing key alias}"
            : "${KEY_PASSWORD:?Missing key password}"

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"

          else

            echo "::warning::Temporary signing key. Fresh installations only."

            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=viewscreen

            echo "::add-mask::$KEYSTORE_PASSWORD"

            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=TNR_, O=TNR_'

          fi

          {
            echo "VIEWSCREEN_KEYSTORE=$KEYSTORE"
            echo "VIEWSCREEN_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "VIEWSCREEN_KEY_ALIAS=$KEY_ALIAS"
            echo "VIEWSCREEN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Host and Client
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          gradle \
            :host:assembleRelease \
            :client:assembleRelease \
            --no-daemon \
            --stacktrace

      - name: Collect release APKs
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p output

          cp project/host/build/outputs/apk/release/host-release.apk \
            output/ViewScreen-Host-0.4.apk

          cp project/client/build/outputs/apk/release/client-release.apk \
            output/ViewScreen-Client-0.4.apk

      - name: Verify APK signatures
        shell: bash
        run: |
          set -euo pipefail

          for APK in output/*.apk; do
            echo "Verifying $APK"

            "$VIEWSCREEN_SDK/build-tools/35.0.0/apksigner" \
              verify --verbose --print-certs "$APK"
          done

      - name: Generate checksums
        shell: bash
        run: |
          cd output
          sha256sum *.apk > SHA256SUMS.txt

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ViewScreen-0.4-Host-Client-TNR
          path: output/
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing files
        if: always()
        shell: bash
        run: rm -f "$RUNNER_TEMP/viewscreen.keystore"
