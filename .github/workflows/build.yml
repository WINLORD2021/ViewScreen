name: ViewScreen 0.3 - Host and Client

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v6

      - name: Verify and extract source
        shell: bash
        run: |
          set -euo pipefail
          ZIP=ViewScreen-0.3-Host-Client.zip

          echo "f39b625e13988541644a7c87d4fa046d65c925ade1c5bb9a7d18af4b64ab094a  $ZIP" | sha256sum -c -

          mkdir -p project
          unzip -q "$ZIP" -d project

          test -f project/host/build.gradle
          test -f project/client/build.gradle
          test -f project/settings.gradle

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Test ViewScreen protocol
        run: bash project/tests/run.sh

      - name: Prepare Android SDK
        shell: bash
        run: |
          set -euo pipefail

          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"

          if [[ ! -f "$SDK/platforms/android-35/android.jar" || ! -x "$SDK/build-tools/35.0.0/apksigner" ]]; then
            sdkmanager --sdk_root="$SDK" \
              'platforms;android-35' \
              'build-tools;35.0.0'
          fi

          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "VIEWSCREEN_SDK=$SDK" >> "$GITHUB_ENV"

      - uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '8.10.2'

      - name: Configure release signing
        shell: bash
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          set -euo pipefail

          KEYSTORE="$RUNNER_TEMP/viewscreen.keystore"

          if [[ -n "$KEYSTORE_BASE64" ]]; then
            : "${KEYSTORE_PASSWORD:?Missing password}"
            : "${KEY_ALIAS:?Missing alias}"
            : "${KEY_PASSWORD:?Missing key password}"

            printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE"
          else
            echo '::warning::Temporary signing key. Fresh installations only.'

            KEYSTORE_PASSWORD="$(openssl rand -hex 24)"
            KEY_PASSWORD="$KEYSTORE_PASSWORD"
            KEY_ALIAS=viewscreen

            echo "::add-mask::$KEYSTORE_PASSWORD"

            keytool -genkeypair \
              -keystore "$KEYSTORE" \
              -storetype PKCS12 \
              -storepass "$KEYSTORE_PASSWORD" \
              -keypass "$KEY_PASSWORD" \
              -alias "$KEY_ALIAS" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname 'CN=TNR_, O=TNR_'
          fi

          {
            echo "VIEWSCREEN_KEYSTORE=$KEYSTORE"
            echo "VIEWSCREEN_STORE_PASSWORD=$KEYSTORE_PASSWORD"
            echo "VIEWSCREEN_KEY_ALIAS=$KEY_ALIAS"
            echo "VIEWSCREEN_KEY_PASSWORD=$KEY_PASSWORD"
          } >> "$GITHUB_ENV"

      - name: Build Host and Client
        working-directory: project
        run: |
          gradle \
            :host:assembleRelease \
            :client:assembleRelease \
            --no-daemon --stacktrace

      - name: Collect and verify APKs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p output

          cp project/host/build/outputs/apk/release/host-release.apk \
            output/ViewScreen-Host-0.3.apk

          cp project/client/build/outputs/apk/release/client-release.apk \
            output/ViewScreen-Client-0.3.apk

          for APK in output/*.apk; do
            "$VIEWSCREEN_SDK/build-tools/35.0.0/apksigner" \
              verify --verbose --print-certs "$APK"
          done

      - uses: actions/upload-artifact@v4
        with:
          name: ViewScreen-0.3-Host-Client
          path: output/*.apk
          if-no-files-found: error
          retention-days: 30

      - name: Clean signing files
        if: always()
        run: rm -f "$RUNNER_TEMP/viewscreen.keystore"
